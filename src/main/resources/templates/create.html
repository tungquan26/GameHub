<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Tournament - BTP Tournament</title>
    <!-- Kế thừa CSS biến và Sidebar từ Dashboard -->
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/create.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ===== SIDEBAR (Chuẩn 100% từ dashboard.html) ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner">
            <div class="sidebar-logo">
                <a th:href="@{/dashboard}" class="sidebar-logo-link">
                    <img th:src="@{/images/logo.png}" alt="Logo" class="sidebar-logo-img">
                </a>
            </div>

            <nav class="sidebar-nav">
                <div class="sidebar-group">
                    <a th:href="@{/dashboard}" class="sidebar-item" data-tooltip="Trang chủ">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    </a>
                    <a href="#" class="sidebar-item" data-tooltip="Tìm kiếm">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    </a>
                    <a href="#" class="sidebar-item active" data-tooltip="Giải đấu">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 010-5H6"/><path d="M18 9h1.5a2.5 2.5 0 000-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 19.24 7 20v2"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 19.24 17 20v2"/><path d="M18 2H6v7a6 6 0 0012 0V2z"/></svg>
                    </a>
                </div>

                <div class="sidebar-group">
                    <a href="#" class="sidebar-item" data-tooltip="Cộng đồng">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                    </a>
                    <a href="#" class="sidebar-item" data-tooltip="Tin nhắn">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                    </a>
                    <a href="#" class="sidebar-item" data-tooltip="Thông báo">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
                    </a>
                </div>

                <div class="sidebar-group sidebar-group-bottom">
                    <a href="#" class="sidebar-item" data-tooltip="Hồ sơ">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </a>
                    <a th:href="@{/login}" class="sidebar-item" id="logoutBtn" data-tooltip="Đăng xuất">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </a>
                </div>
            </nav>
        </div>
    </aside>

    <!-- ===== MOBILE TOPBAR ===== -->
    <div class="mobile-topbar" id="mobileTopbar">
        <a th:href="@{/dashboard}" class="mobile-logo-link">
            <img th:src="@{/images/logo.png}" alt="Logo" class="mobile-logo-img">
        </a>
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content" id="mainContent">
        
        <!-- Topbar Breadcrumb (Giống ảnh 1) -->
        <header class="top-breadcrumb">
            <a th:href="@{/dashboard}" class="breadcrumb-home">Home</a>
            <span class="breadcrumb-slash">/</span>
            <span class="breadcrumb-page">Create Page</span>
        </header>

        <!-- Trung tâm điền thông tin (Giống ảnh 2, đã bỏ chữ Step) -->
        <section class="create-container">
            <div class="create-card">
                <h2 class="card-heading">Basic Information</h2>

                <form id="createForm">
                    <!-- Tournament Name -->
                    <div class="field-box full-width">
                        <label class="field-label">Tournament Name <span class="req">*</span></label>
                        <input type="text" id="tournamentName" class="field-input" placeholder="My Awesome Tournament" required>
                    </div>

                    <!-- Contact type & Contact -->
                    <div class="field-row">
                        <div class="field-box">
                            <label class="field-label">Contact type <span class="req">*</span></label>
                            <div class="input-with-icon">
                                <svg class="left-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                                <select id="contactType" class="field-input has-icon" required>
                                    <option value="EMAIL">Email</option>
                                    <option value="DISCORD">Discord</option>
                                    <option value="PHONE">Phone</option>
                                </select>
                            </div>
                        </div>

                        <div class="field-box">
                            <label class="field-label">Contact <span class="req">*</span></label>
                            <div class="input-with-icon">
                                <svg class="left-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                                <input type="text" id="contactValue" class="field-input has-icon" placeholder="hello@start.gg" required>
                            </div>
                        </div>
                    </div>

                    <!-- Start Date & End Date -->
                    <div class="field-row">
                        <div class="field-box">
                            <label class="field-label">Start Date <span class="req">*</span></label>
                            <input type="datetime-local" id="startDate" class="field-input" required>
                        </div>

                        <div class="field-box">
                            <label class="field-label">End Date <span class="req">*</span></label>
                            <input type="datetime-local" id="endDate" class="field-input" required>
                        </div>
                    </div>

                    <p id="errorMsg" class="error-text" style="display: none;"></p>

                    <button type="submit" id="submitBtn" class="btn-create" disabled>Create Tournament</button>
                </form>
            </div>
        </section>

    </main>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <script th:src="@{/js/create.js}"></script>
</body>
</html>
