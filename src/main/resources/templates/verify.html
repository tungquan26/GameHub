<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cần Được Xác Thực - BTP-OOP</title>
    <link rel="stylesheet" th:href="@{/css/verify.css}" href="verify.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Hình nền phủ toàn màn hình -->
    <div class="background-container">
        <img th:src="@{/images/nen_login.png}" src="/images/nen_login.png" alt="Background" class="bg-image">
    </div>

    <!-- Logo ở góc trên bên trái -->
    <div class="logo-container">
        <a href="/">
            <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="Logo" class="logo">
        </a>
    </div>

    <!-- Khung xác thực trung tâm -->
    <div class="login-wrapper">
        <div class="login-box">
            <h2>Cần Được Xác Thực</h2>

            <p class="verify-subtitle">
                Nhập mã chúng tôi đã gửi đến<br>
                <span id="maskedEmail" th:text="${maskedEmail != null ? maskedEmail : 'qua**@****.com'}">qua**@****.com</span>
            </p>

            <form id="verifyForm" class="login-form">
                <!-- 6 ô nhập mã OTP -->
                <div class="otp-container" id="otpContainer">
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" required>
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required>
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required>
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required>
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required>
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required>
                </div>

                <!-- Ghi nhớ trình duyệt -->
                <div class="remember-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberBrowser" name="rememberBrowser">
                        <span class="custom-checkbox"></span>
                        <span class="label-text">Nhớ trình duyệt này trong 30 ngày</span>
                    </label>
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <!-- Nút gửi -->
                <button type="submit" class="btn-submit" id="submitBtn" disabled>
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <!-- Liên kết phía dưới -->
            <div class="login-links">
                <a href="#" id="resendCodeBtn">GỬI LẠI MÃ</a>
                <a th:href="@{/support}" href="#">KHÔNG THỂ TRUY CẬP VÀO ĐỊA CHỈ EMAIL ĐÓ?</a>
            </div>
        </div>
    </div>

    <!-- Footer góc dưới bên trái -->
    <footer class="page-footer">
        <a href="#">HỖ TRỢ</a>
        <a href="#">CHÍNH SÁCH QUYỀN RIÊNG TƯ</a>
        <a href="#">ĐIỀU KHOẢN SỬ DỤNG</a>
        <a href="#">TÙY CHỌN COOKIES</a>
        <button type="button" class="lang-btn">
            <span>EN</span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
        </button>
    </footer>

    <script th:src="@{/js/verify.js}" src="verify.js"></script>
</body>

</html>
