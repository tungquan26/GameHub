<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- ===== SIDEBAR CHÍNH ===== -->
    <aside class="sidebar" id="sidebar" th:fragment="sidebar(activeNav)">
        <div class="sidebar-inner">
            <div class="sidebar-logo">
                <a th:href="@{/dashboard}" class="sidebar-logo-link">
                    <img th:src="@{/images/logo.png}" alt="Logo" class="sidebar-logo-img">
                </a>
            </div>

            <nav class="sidebar-nav">
                <div class="sidebar-group">
                    <a th:href="@{/dashboard}" class="sidebar-item"
                       th:classappend="${activeNav == 'home'} ? ' active' : ''"
                       data-tooltip="Trang chủ">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </a>
                    <a th:href="@{/search}" class="sidebar-item"
                       th:classappend="${activeNav == 'search'} ? ' active' : ''"
                       data-tooltip="Tìm kiếm">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </a>
                    <a th:href="@{/events}" class="sidebar-item"
                       th:classappend="${activeNav == 'tournaments'} ? ' active' : ''"
                       data-tooltip="Sự kiện">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 9H4.5a2.5 2.5 0 010-5H6"/>
                            <path d="M18 9h1.5a2.5 2.5 0 000-5H18"/>
                            <path d="M4 22h16"/>
                            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 19.24 7 20v2"/>
                            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 19.24 17 20v2"/>
                            <path d="M18 2H6v7a6 6 0 0012 0V2z"/>
                        </svg>
                    </a>
                </div>

                <div class="sidebar-group">
                    <a th:href="@{/community}" class="sidebar-item"
                       th:classappend="${activeNav == 'community'} ? ' active' : ''"
                       data-tooltip="Cộng đồng">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 00-3-3.87"/>
                            <path d="M16 3.13a4 4 0 010 7.75"/>
                        </svg>
                    </a>
                    <a href="#" class="sidebar-item" data-tooltip="Tin nhắn">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                        </svg>
                    </a>
                    <a href="#" class="sidebar-item" data-tooltip="Thông báo">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 01-3.46 0"/>
                        </svg>
                    </a>
                </div>

                <!-- Nút dấu cộng (+) Create Event giống Start.gg -->
                <div class="sidebar-group">
                    <a th:href="@{/create}" class="sidebar-item sidebar-item-create"
                       th:classappend="${activeNav == 'create'} ? ' active' : ''"
                       id="sidebarCreateEventBtn"
                       data-tooltip="Create event">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </a>
                </div>

                <!-- Nút Hồ sơ hình tròn kèm Ảnh đại diện & Hộp Popup Menu -->
                <div class="sidebar-group sidebar-group-bottom sidebar-profile-wrapper">
                    <button type="button"
                            class="sidebar-avatar-btn"
                            id="sidebarProfileBtn"
                            th:classappend="${activeNav == 'profile'} ? ' active' : ''"
                            aria-label="Hồ sơ người dùng">
                        <img id="sidebarUserAvatarImg" src="" alt="Avatar" class="sidebar-avatar-img" style="display: none;">
                        <span id="sidebarUserAvatarInitial" class="sidebar-avatar-initial">T</span>
                    </button>

                    <!-- Hộp Popup Menu hiện ra khi bấm nút Hồ sơ -->
                    <div class="sidebar-profile-popover" id="sidebarProfilePopover" style="display: none;">
                        <div class="spp-menu-list">
                            <a th:href="@{/profile/settings(tab='profile')}" class="spp-menu-item">Profile Settings</a>
                            <a th:href="@{/profile/settings(tab='account')}" class="spp-menu-item">Account Settings</a>
                            <a th:href="@{/login}" class="spp-menu-item spp-menu-logout" id="logoutBtn">Logout</a>
                        </div>
                        <div class="spp-divider"></div>
                        <a th:href="@{/profile}" class="spp-user-footer" id="popoverUserProfileLink">
                            <div class="spp-user-left">
                                <div class="spp-user-avatar">
                                    <img id="popoverUserAvatarImg" src="" alt="Avatar" class="spp-user-avatar-img" style="display: none;">
                                    <span id="popoverUserAvatarInitial" class="spp-user-avatar-initial">T</span>
                                </div>
                                <span class="spp-user-tag" id="popoverUserTagName">tungquan</span>
                            </div>
                            <span class="spp-user-arrow">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="9 18 15 12 9 6"/>
                                </svg>
                            </span>
                        </a>
                    </div>
                </div>
            </nav>
        </div>
    </aside>

    <!-- ===== MOBILE TOPBAR ===== -->
    <div class="mobile-topbar" id="mobileTopbar" th:fragment="mobileTopbar">
        <a th:href="@{/dashboard}" class="mobile-logo-link">
            <img th:src="@{/images/logo.png}" alt="Logo" class="mobile-logo-img">
        </a>
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
    </div>

    <!-- ===== SIDEBAR OVERLAY ===== -->
    <div class="sidebar-overlay" id="sidebarOverlay" th:fragment="sidebarOverlay"></div>

</body>
</html>
