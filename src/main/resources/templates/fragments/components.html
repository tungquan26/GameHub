<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Fragment Card chuẩn Start.gg -->
    <div class="settings-card" th:id="${cardId}" th:fragment="card(cardId, title, subtitle, bodyContent, footerContent)">
        <div class="card-header">
            <h2 class="card-title" th:text="${title}">Card Title</h2>
            <p class="card-subtitle" th:if="${subtitle != null}" th:text="${subtitle}">Card subtitle</p>
        </div>
        <div class="card-body">
            <th:block th:replace="${bodyContent}" />
        </div>
        <div class="card-footer" th:if="${footerContent != null}">
            <th:block th:replace="${footerContent}" />
        </div>
    </div>

    <!-- Fragment Footer có nút Save changes -->
    <div class="card-footer" th:fragment="saveFooter(btnId, btnType)">
        <button th:type="${btnType != null ? btnType : 'button'}"
                th:id="${btnId}"
                class="btn-save"
                disabled>Save changes</button>
    </div>

</body>
</html>
