<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layouts/base :: commonHead('Xem giải đấu - BTP Tournament')}" />
    <link rel="stylesheet" th:href="@{/css/layouts/app-layout.css}">
    <link rel="stylesheet" th:href="@{/css/pages/tournament/home.css}">
    <link rel="stylesheet" th:href="@{/css/pages/tournament/view.css}">
    <link rel="stylesheet" th:href="@{/css/common/toast.css}">
</head>
<body>
    <!-- 1. SIDEBAR CHÍNH (72px) -->
    <aside th:replace="~{fragments/app-sidebar :: sidebar('tournaments')}"></aside>

    <!-- 2. HỘP BÊN TRÁI GIẢI ĐẤU -->
    <aside class="tv-sidebar" id="tournamentSidebar">
        <!-- Header giải đấu có nền ảnh Banner tối màu -->
        <div class="tv-header" id="tvSidebarBanner">
            <div class="tv-header-overlay">
                <div class="tv-identity">
                    <div class="tv-avatar-box">
                        <img id="tvSidebarAvatarImg" src="" alt="Ảnh đại diện" class="tv-avatar-img" style="display: none;">
                        <div id="tvSidebarAvatarFallback" class="tv-avatar-fallback">G</div>
                    </div>
                    <div class="tv-title-group">
                        <h2 class="tv-tourney-name" id="tvSidebarTourneyName">Giải đấu mới</h2>
                        <span class="tv-tourney-label">GIẢI ĐẤU</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Phần thân hộp bên trái -->
        <div class="tv-sidebar-body">
            <!-- Nút Đăng ký tham gia -->
            <div class="tv-register-wrap">
                <button type="button" class="tv-register-btn" id="tvRegisterNowBtn">Đăng ký tham gia</button>
            </div>

            <!-- Ngày tháng & Địa điểm -->
            <div class="tv-meta-block">
                <div class="tv-meta-row">
                    <svg class="tv-meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <span id="tvSidebarDateRange">15/10 — 16/10/2026</span>
                </div>

                <div class="tv-meta-row">
                    <svg class="tv-meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    <span id="tvSidebarLocation">Hà Nội, Việt Nam</span>
                </div>
            </div>

            <!-- Đường phân cách -->
            <div class="tv-divider"></div>

            <!-- Danh sách Thông tin bộ môn từ Game Info -->
            <div class="tv-game-list" id="tvSidebarGameInfoList">
                <!-- Được render động bởi view.js -->
            </div>
        </div>
    </aside>

    <!-- MOBILE TOPBAR -->
    <div th:replace="~{fragments/app-sidebar :: mobileTopbar}"></div>

    <!-- 3. PHẦN BÊN PHẢI: NỘI DUNG TRANG HOME CỦA GIẢI ĐẤU -->
    <main class="tv-main-content" id="mainContent">
        <div class="th-page-wrapper">
            <!-- PHẦN ĐẦU: ẢNH BÌA & THÔNG TIN GIẢI ĐẤU -->
            <div class="th-hero-section">
                <div class="th-banner-box" id="homeBannerBox">
                    <img id="homeBannerImg" src="" alt="Ảnh bìa giải đấu" class="th-banner-img" style="display: none;">
                    <div id="homeBannerFallback" class="th-banner-fallback"></div>
                </div>

                <div class="th-header-bar">
                    <div class="th-header-inner">
                        <div class="th-profile-box">
                            <img id="homeProfileImg" src="" alt="Ảnh đại diện giải đấu" class="th-profile-img" style="display: none;">
                            <div id="homeProfileFallback" class="th-profile-fallback">G</div>
                        </div>

                        <div class="th-identity-info">
                            <span class="th-type-label">GIẢI ĐẤU</span>
                            <h1 class="th-tourney-title" id="homeTourneyName">Giải đấu mới</h1>
                            <div class="th-meta-list">
                                <!-- Ngày tháng -->
                                <div class="th-meta-item">
                                    <svg viewBox="0 0 20 20" fill="currentColor" class="th-meta-icon">
                                        <path fill-rule="evenodd" d="M5.75 2a.75.75 0 01.75.75V4h7V2.75a.75.75 0 011.5 0V4h.25A2.75 2.75 0 0118 6.75v8.5A2.75 2.75 0 0115.25 18H4.75A2.75 2.75 0 012 15.25v-8.5A2.75 2.75 0 014.75 4H5V2.75A.75.75 0 015.75 2zm-1 5.5c-.69 0-1.25.56-1.25 1.25v6.5c0 .69.56 1.25 1.25 1.25h10.5c.69 0 1.25-.56 1.25-1.25v-6.5c0-.69-.56-1.25-1.25-1.25H4.75z" clip-rule="evenodd"/>
                                    </svg>
                                    <span id="homeDateRange">15/10 — 16/10/2026</span>
                                </div>

                                <!-- Địa điểm -->
                                <div class="th-meta-item" id="homeMetaVenueWrap">
                                    <svg viewBox="0 0 20 20" fill="currentColor" class="th-meta-icon">
                                        <path fill-rule="evenodd" d="M9.69 18.933l.003.001C9.89 19.02 10 19 10 19s.11.02.308-.066l.002-.001.006-.003.018-.008a5.741 5.741 0 00.281-.14c.186-.096.446-.24.757-.433.62-.384 1.445-.966 2.274-1.765C15.302 14.988 17 12.493 17 9A7 7 0 103 9c0 3.492 1.698 5.988 3.355 7.584a13.731 13.731 0 002.273 1.765 11.842 11.842 0 00.976.544l.062.029.018.008.006.003zM10 11.25a2.25 2.25 0 100-4.5 2.25 2.25 0 000 4.5z" clip-rule="evenodd"/>
                                    </svg>
                                    <span id="homeVenueText">Chưa cập nhật địa điểm</span>
                                </div>

                                <!-- Liên hệ -->
                                <div class="th-meta-item" id="homeMetaContactWrap">
                                    <span class="th-meta-icon" id="homeMetaContactIcon"></span>
                                    <a href="#" id="homeContactLink" class="th-meta-link">quannguyen041026@gmail.com</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CÁC SECTION NỘI DUNG BÊN DƯỚI (ĐỒNG BỘ TỪ TRANG HOME CỦA TOURNAMENT SETTINGS) -->
            <div class="th-sections-container" id="thSectionsContainer">
                <!-- Render tự động bởi view.js -->
            </div>
        </div>
    </main>

    <!-- Overlay & Toast -->
    <div th:replace="~{fragments/app-sidebar :: sidebarOverlay}"></div>
    <div th:replace="~{fragments/toast :: toast}"></div>

    <script type="module" th:src="@{/js/pages/tournament/view.js}"></script>
</body>
</html>
