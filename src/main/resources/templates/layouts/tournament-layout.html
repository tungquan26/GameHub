<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, pageHeaderTitle, activeSection, extraLinks, content, scripts)">
<head>
    <th:block th:replace="~{layouts/base :: commonHead(${title})}" />
    <link rel="stylesheet" th:href="@{/css/layouts/app-layout.css}">
    <link rel="stylesheet" th:href="@{/css/layouts/tournament-layout.css}">
    <link rel="stylesheet" th:href="@{/css/common/components.css}">
    <link rel="stylesheet" th:href="@{/css/common/toast.css}">
    <th:block th:replace="${extraLinks} ?: ~{}" />
</head>
<body>
    <!-- 1. SIDEBAR CHÍNH -->
    <aside th:replace="~{fragments/app-sidebar :: sidebar('tournaments')}"></aside>

    <!-- 2. TOURNAMENT SETTINGS SUB-SIDEBAR -->
    <aside th:replace="~{fragments/tournament-sidebar :: tournamentSidebar(${activeSection})}"></aside>

    <!-- MOBILE TOPBAR -->
    <div th:replace="~{fragments/app-sidebar :: mobileTopbar}"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content" id="mainContent">
        <header class="settings-topbar" id="settingsTopbar">
            <h1 class="page-title" id="pageHeaderTitle" th:text="${pageHeaderTitle}">Chi tiết</h1>
        </header>

        <section class="settings-container">
            <th:block th:replace="${content}" />
        </section>
    </main>

    <!-- Overlay cho Mobile Sidebar & Toast thông báo -->
    <div th:replace="~{fragments/app-sidebar :: sidebarOverlay}"></div>
    <div th:replace="~{fragments/toast :: toast}"></div>

    <script type="module" th:src="@{/js/layouts/tournament-layout.js}"></script>
    <th:block th:replace="${scripts} ?: ~{}" />
</body>
</html>
