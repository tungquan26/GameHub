<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, activeNav, extraLinks, content, scripts)">
<head>
    <th:block th:replace="~{layouts/base :: commonHead(${title})}" />
    <link rel="stylesheet" th:href="@{/css/layouts/app-layout.css}">
    <th:block th:replace="${extraLinks} ?: ~{}" />
</head>
<body>
    <!-- SIDEBAR CHÍNH -->
    <aside th:replace="~{fragments/app-sidebar :: sidebar(${activeNav})}"></aside>

    <!-- MOBILE TOPBAR -->
    <div th:replace="~{fragments/app-sidebar :: mobileTopbar}"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content" id="mainContent">
        <th:block th:replace="${content}" />
    </main>

    <!-- Sidebar overlay for mobile -->
    <div th:replace="~{fragments/app-sidebar :: sidebarOverlay}"></div>

    <script type="module" th:src="@{/js/layouts/app-layout.js}"></script>
    <th:block th:replace="${scripts} ?: ~{}" />
</body>
</html>
