<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BTP Tournament</title>
    <meta name="description" content="Trang quản lý giải đấu esports - Community through competition">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner">
            <!-- Logo -->
            <div class="sidebar-logo">
                <a href="/dashboard" class="sidebar-logo-link">
                    <img th:src="@{/images/logo.png}" alt="Logo" class="sidebar-logo-img">
                </a>
            </div>

            <!-- Navigation Group 1: Main -->
            <nav class="sidebar-nav">
                <div class="sidebar-group">
                    <a href="/dashboard" class="sidebar-item active" data-tooltip="Trang chủ">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </a>
                    <a href="#" class="sidebar-item" data-tooltip="Tìm kiếm">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </a>
                    <a href="#" class="sidebar-item" data-tooltip="Giải đấu">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 9H4.5a2.5 2.5 0 010-5H6"/>
                            <path d="M18 9h1.5a2.5 2.5 0 000-5H18"/>
                            <path d="M4 22h16"/>
                            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 19.24 7 20v2"/>
                            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 19.24 17 20v2"/>
                            <path d="M18 2H6v7a6 6 0 0012 0V2z"/>
                        </svg>
                    </a>
                </div>

                <!-- Navigation Group 2: Social -->
                <div class="sidebar-group">
                    <a href="#" class="sidebar-item" data-tooltip="Cộng đồng">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 00-3-3.87"/>
                            <path d="M16 3.13a4 4 0 010 7.75"/>
                        </svg>
                    </a>
                    <a href="#" class="sidebar-item" data-tooltip="Tin nhắn">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                        </svg>
                    </a>
                    <a href="#" class="sidebar-item" data-tooltip="Thông báo">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 01-3.46 0"/>
                        </svg>
                    </a>
                </div>

                <!-- Navigation Group 3: User -->
                <div class="sidebar-group sidebar-group-bottom">
                    <a href="#" class="sidebar-item" data-tooltip="Hồ sơ">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </a>
                    <a href="#" class="sidebar-item" id="logoutBtn" data-tooltip="Đăng xuất">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                    </a>
                </div>
            </nav>
        </div>
    </aside>

    <!-- ===== MOBILE TOPBAR ===== -->
    <div class="mobile-topbar" id="mobileTopbar">
        <a href="/dashboard" class="mobile-logo-link">
            <img th:src="@{/images/logo.png}" alt="Logo" class="mobile-logo-img">
        </a>
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content" id="mainContent">

        <!-- Hero Banner -->
        <section class="hero-banner">
            <div class="hero-bg-pattern"></div>
            <div class="hero-content">
                <img th:src="@{/images/logo.png}" alt="BTP Tournament" class="hero-logo">
                <p class="hero-tagline">Community through competition</p>
                <div class="hero-actions">
                    <button class="hero-btn hero-btn-primary" id="createEventBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Create an event
                    </button>
                    <button class="hero-btn hero-btn-secondary" id="findEventsBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        Find events
                    </button>
                </div>
            </div>
        </section>

        <!-- Filter Bar -->
        <section class="filter-bar">
            <div class="filter-bar-inner">
                <h2 class="section-title">Tournaments</h2>
                <div class="filter-controls">
                    <div class="search-box">
                        <svg class="search-box-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm giải đấu...">
                    </div>
                    <div class="game-filter">
                        <select id="gameFilter" class="game-select">
                            <option value="">Choose your game</option>
                            <option value="Liên Minh Huyền Thoại">Liên Minh Huyền Thoại</option>
                            <option value="Valorant">Valorant</option>
                            <option value="CS2">CS2</option>
                            <option value="PUBG">PUBG</option>
                            <option value="Dota 2">Dota 2</option>
                            <option value="FIFA Online">FIFA Online</option>
                            <option value="Street Fighter 6">Street Fighter 6</option>
                            <option value="Super Smash Bros">Super Smash Bros</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <!-- Tournament Grid -->
        <section class="tournaments-section">
            <div class="tournaments-grid" id="tournamentsGrid">
                <!-- Cards sẽ được render bởi JS -->
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <p>Không tìm thấy giải đấu nào phù hợp.</p>
            </div>

            <!-- Load More -->
            <div class="load-more-container" id="loadMoreContainer">
                <button class="load-more-btn" id="loadMoreBtn">Xem thêm</button>
            </div>
        </section>

    </main>

    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
