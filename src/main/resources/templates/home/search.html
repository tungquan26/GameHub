<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app-layout :: layout('Tìm kiếm giải đấu - BTP Tournament', 'search', ~{::link}, ~{::pageContent}, ~{::script})}">
<head>
    <link rel="stylesheet" th:href="@{/css/pages/home/search.css}">
</head>
<body>
    <th:block th:fragment="pageContent">
        <div class="search-page">
            <!-- ==================== HEADER BANNER ==================== -->
            <section class="search-hero">
                <div class="search-hero-pattern"></div>
                <div class="search-container">
                    <!-- Tiêu đề Giải đấu -->
                    <div class="search-type-bar">
                        <span class="search-type-text">Giải đấu</span>
                    </div>

                    <!-- Thanh tìm kiếm đôi (Split Search Bar) -->
                    <div class="split-search-bar">
                        <!-- Ô tìm kiếm tên giải đấu -->
                        <div class="split-search-field split-search-main">
                            <svg class="split-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            <input type="text"
                                   id="tournamentSearchInput"
                                   class="split-input"
                                   placeholder="Tìm kiếm tên giải đấu hoặc tựa game..."
                                   autocomplete="off">
                            <button type="button" class="split-clear-btn" id="clearKeywordBtn" style="display: none;" aria-label="Xóa tìm kiếm">&times;</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ==================== BODY CONTENT ==================== -->
            <section class="search-body">
                <div class="search-container">
                    <!-- Hàng nút lọc: 1 nút "Bộ lọc" gộp Trạng thái, Tựa game, Ngày bắt đầu -->
                    <div class="filter-pills-row">
                        <div class="pill-dropdown-wrapper" id="filterPillWrapper">
                            <button type="button" class="filter-pill-btn" id="filterPillBtn">
                                <svg class="pill-filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                                </svg>
                                <span id="filterPillLabel">Bộ lọc</span>
                                <svg class="pill-caret" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M7 10l5 5 5-5z"/>
                                </svg>
                            </button>
                            <div class="pill-dropdown-menu filter-popover-card" id="filterDropdownMenu" style="display: none;">
                                <div class="popover-body popover-body-scroll">
                                    <!-- Mục 1: Trạng thái -->
                                    <div class="popover-section">
                                        <div class="popover-section-title">TRẠNG THÁI GIẢI ĐẤU</div>
                                        <label class="popover-check-item">
                                            <input type="checkbox" name="statusFilter" value="upcoming">
                                            <span class="custom-checkbox"></span>
                                            <span class="check-label-text">Sắp diễn ra</span>
                                        </label>
                                        <label class="popover-check-item">
                                            <input type="checkbox" name="statusFilter" value="in_progress">
                                            <span class="custom-checkbox"></span>
                                            <span class="check-label-text">Đang diễn ra</span>
                                        </label>
                                        <label class="popover-check-item">
                                            <input type="checkbox" name="statusFilter" value="completed">
                                            <span class="custom-checkbox"></span>
                                            <span class="check-label-text">Đã kết thúc</span>
                                        </label>
                                    </div>

                                    <!-- Mục 2: Tựa game -->
                                    <div class="popover-section">
                                        <div class="popover-section-title">TỰA GAME</div>
                                        <div class="popover-check-list-scroll">
                                            <label class="popover-check-item">
                                                <input type="checkbox" name="gameFilter" value="Liên Minh Huyền Thoại">
                                                <span class="custom-checkbox"></span>
                                                <span class="check-label-text">Liên Minh Huyền Thoại</span>
                                            </label>
                                            <label class="popover-check-item">
                                                <input type="checkbox" name="gameFilter" value="Valorant">
                                                <span class="custom-checkbox"></span>
                                                <span class="check-label-text">Valorant</span>
                                            </label>
                                            <label class="popover-check-item">
                                                <input type="checkbox" name="gameFilter" value="Teamfight Tactics">
                                                <span class="custom-checkbox"></span>
                                                <span class="check-label-text">Teamfight Tactics</span>
                                            </label>
                                            <label class="popover-check-item">
                                                <input type="checkbox" name="gameFilter" value="CS2">
                                                <span class="custom-checkbox"></span>
                                                <span class="check-label-text">CS2</span>
                                            </label>
                                            <label class="popover-check-item">
                                                <input type="checkbox" name="gameFilter" value="Delta Force">
                                                <span class="custom-checkbox"></span>
                                                <span class="check-label-text">Delta Force</span>
                                            </label>
                                            <label class="popover-check-item">
                                                <input type="checkbox" name="gameFilter" value="The Isle">
                                                <span class="custom-checkbox"></span>
                                                <span class="check-label-text">The Isle</span>
                                            </label>
                                            <label class="popover-check-item">
                                                <input type="checkbox" name="gameFilter" value="PUBG">
                                                <span class="custom-checkbox"></span>
                                                <span class="check-label-text">PUBG</span>
                                            </label>
                                            <label class="popover-check-item">
                                                <input type="checkbox" name="gameFilter" value="Dota 2">
                                                <span class="custom-checkbox"></span>
                                                <span class="check-label-text">Dota 2</span>
                                            </label>
                                            <label class="popover-check-item">
                                                <input type="checkbox" name="gameFilter" value="FIFA Online">
                                                <span class="custom-checkbox"></span>
                                                <span class="check-label-text">FIFA Online</span>
                                            </label>
                                            <label class="popover-check-item">
                                                <input type="checkbox" name="gameFilter" value="Street Fighter 6">
                                                <span class="custom-checkbox"></span>
                                                <span class="check-label-text">Street Fighter 6</span>
                                            </label>
                                            <label class="popover-check-item">
                                                <input type="checkbox" name="gameFilter" value="Super Smash Bros. Ultimate">
                                                <span class="custom-checkbox"></span>
                                                <span class="check-label-text">Super Smash Bros. Ultimate</span>
                                            </label>
                                            <label class="popover-check-item">
                                                <input type="checkbox" name="gameFilter" value="Avatar Legends: The Fighting Game">
                                                <span class="custom-checkbox"></span>
                                                <span class="check-label-text">Avatar Legends: The Fighting Game</span>
                                            </label>
                                            <label class="popover-check-item">
                                                <input type="checkbox" name="gameFilter" value="2XKO">
                                                <span class="custom-checkbox"></span>
                                                <span class="check-label-text">2XKO</span>
                                            </label>
                                        </div>
                                    </div>

                                    <!-- Mục 3: Ngày bắt đầu -->
                                    <div class="popover-section">
                                        <div class="popover-section-title">NGÀY BẮT ĐẦU</div>
                                        <label class="popover-check-item">
                                            <input type="checkbox" name="dateRangeFilter" value="next_7_days">
                                            <span class="custom-checkbox"></span>
                                            <span class="check-label-text">7 ngày tới</span>
                                        </label>
                                        <label class="popover-check-item">
                                            <input type="checkbox" name="dateRangeFilter" value="next_month">
                                            <span class="custom-checkbox"></span>
                                            <span class="check-label-text">Tháng tới</span>
                                        </label>
                                        <label class="popover-check-item">
                                            <input type="checkbox" name="dateRangeFilter" value="next_3_months">
                                            <span class="custom-checkbox"></span>
                                            <span class="check-label-text">3 tháng tới</span>
                                        </label>
                                        <label class="popover-check-item">
                                            <input type="checkbox" name="dateRangeFilter" value="next_6_months">
                                            <span class="custom-checkbox"></span>
                                            <span class="check-label-text">6 tháng tới</span>
                                        </label>
                                        <label class="popover-check-item">
                                            <input type="checkbox" name="dateRangeFilter" value="past_7_days">
                                            <span class="custom-checkbox"></span>
                                            <span class="check-label-text">7 ngày qua</span>
                                        </label>
                                        <label class="popover-check-item">
                                            <input type="checkbox" name="dateRangeFilter" value="custom">
                                            <span class="custom-checkbox"></span>
                                            <span class="check-label-text">Tùy chọn ngày</span>
                                        </label>

                                        <div class="custom-dates-box" id="customDatesBox" style="display: none;">
                                            <div class="custom-date-field">
                                                <label for="customStartDateInput">Từ ngày</label>
                                                <input type="date" id="customStartDateInput" class="custom-date-input">
                                            </div>
                                            <div class="custom-date-field">
                                                <label for="customEndDateInput">Đến ngày</label>
                                                <input type="date" id="customEndDateInput" class="custom-date-input">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="popover-footer">
                                    <button type="button" class="popover-btn-clear" id="clearAllFilterBtn">Xóa</button>
                                    <button type="button" class="popover-btn-done" id="doneFilterBtn">Áp dụng</button>
                                </div>
                            </div>
                        </div>

                        <!-- Nút Đặt lại bộ lọc -->
                        <button type="button" class="filter-reset-btn" id="resetFiltersBtn" style="display: none;">
                            Đặt lại bộ lọc
                        </button>
                    </div>

                    <!-- Danh sách thẻ giải đấu ngang -->
                    <div class="tournament-list" id="searchTournamentList">
                        <!-- Render bởi search.js -->
                    </div>

                    <!-- Trạng thái trống -->
                    <div class="search-empty-state" id="searchEmptyState" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <h3>Không tìm thấy giải đấu nào</h3>
                        <p>Thử thay đổi từ khóa tìm kiếm hoặc các tùy chọn bộ lọc.</p>
                    </div>

                    <!-- Phân trang (Pagination) -->
                    <nav class="search-pagination" id="searchPagination" aria-label="Phân trang giải đấu">
                        <!-- Render bởi search.js -->
                    </nav>
                </div>
            </section>
        </div>
    </th:block>

    <script type="module" th:src="@{/js/pages/home/search.js}"></script>
</body>
</html>
