<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app-layout :: layout('Tìm kiếm giải đấu - BTP Tournament', 'search', ~{::link}, ~{::pageContent}, ~{::script})}">
<head>
    <link rel="stylesheet" th:href="@{/css/pages/home/search.css}">
</head>
<body>
    <th:block th:fragment="pageContent">
        <div class="search-page">
            <!-- ==================== HEADER BANNER ==================== -->
            <section class="search-hero">
                <div class="search-hero-pattern"></div>
                <div class="search-container">
                    <!-- Tiêu đề Giải đấu -->
                    <div class="search-type-bar">
                        <span class="search-type-text">Giải đấu</span>
                    </div>

                    <!-- Thanh tìm kiếm đôi (Split Search Bar) -->
                    <div class="split-search-bar">
                        <!-- Ô tìm kiếm tên giải đấu -->
                        <div class="split-search-field split-search-main">
                            <svg class="split-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            <input type="text"
                                   id="tournamentSearchInput"
                                   class="split-input"
                                   placeholder="Tìm kiếm tên giải đấu hoặc tựa game..."
                                   autocomplete="off">
                            <button type="button" class="split-clear-btn" id="clearKeywordBtn" style="display: none;" aria-label="Xóa tìm kiếm">&times;</button>
                        </div>

                        <!-- Ô địa điểm -->
                        <div class="split-search-field split-search-location" id="locationFieldWrapper">
                            <svg class="split-location-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                                <circle cx="12" cy="10" r="3"/>
                            </svg>
                            <input type="text"
                                   id="locationSearchInput"
                                   class="split-input"
                                   placeholder="Tất cả địa điểm"
                                   autocomplete="off">
                            <button type="button" class="split-gps-btn" id="locationMenuToggleBtn" title="Chọn nhanh địa điểm">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="7"/>
                                    <circle cx="12" cy="12" r="2"/>
                                    <line x1="12" y1="2" x2="12" y2="5"/>
                                    <line x1="12" y1="19" x2="12" y2="22"/>
                                    <line x1="2" y1="12" x2="5" y2="12"/>
                                    <line x1="19" y1="12" x2="22" y2="12"/>
                                </svg>
                            </button>

                            <!-- Dropdown gợi ý địa điểm -->
                            <div class="location-dropdown" id="locationDropdown" style="display: none;">
                                <div class="dropdown-section-title">Địa điểm phổ biến</div>
                                <button type="button" class="dropdown-item active" data-location="">Tất cả địa điểm</button>
                                <button type="button" class="dropdown-item" data-location="Trực tuyến">Trực tuyến (Online)</button>
                                <button type="button" class="dropdown-item" data-location="Việt Nam">Việt Nam (HCM / Hà Nội / Đà Nẵng)</button>
                                <button type="button" class="dropdown-item" data-location="JP">Nhật Bản (JP)</button>
                                <button type="button" class="dropdown-item" data-location="SE">Thụy Điển (SE)</button>
                                <button type="button" class="dropdown-item" data-location="TH">Thái Lan (TH)</button>
                                <button type="button" class="dropdown-item" data-location="SV">El Salvador (SV)</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ==================== BODY CONTENT ==================== -->
            <section class="search-body">
                <div class="search-container">
                    <!-- Hàng nút lọc Pills: Trạng thái, Tựa game, Ngày bắt đầu -->
                    <div class="filter-pills-row">
                        <!-- Nút 1: Trạng thái -->
                        <div class="pill-dropdown-wrapper" id="filtersPillWrapper">
                            <button type="button" class="filter-pill-btn" id="filtersPillBtn">
                                <span id="filtersPillLabel">Trạng thái</span>
                                <svg class="pill-caret" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M7 10l5 5 5-5z"/>
                                </svg>
                            </button>
                            <div class="pill-dropdown-menu filter-popover-card" id="filtersDropdownMenu" style="display: none;">
                                <div class="popover-body">
                                    <div class="popover-section-title">TRẠNG THÁI GIẢI ĐẤU</div>
                                    <label class="popover-check-item">
                                        <input type="checkbox" name="statusFilter" value="upcoming">
                                        <span class="custom-checkbox"></span>
                                        <span class="check-label-text">Sắp diễn ra</span>
                                    </label>
                                    <label class="popover-check-item">
                                        <input type="checkbox" name="statusFilter" value="in_progress">
                                        <span class="custom-checkbox"></span>
                                        <span class="check-label-text">Đang diễn ra</span>
                                    </label>
                                    <label class="popover-check-item">
                                        <input type="checkbox" name="statusFilter" value="completed">
                                        <span class="custom-checkbox"></span>
                                        <span class="check-label-text">Đã kết thúc</span>
                                    </label>
                                </div>
                                <div class="popover-footer">
                                    <button type="button" class="popover-btn-clear" id="clearStatusFilterBtn">Xóa</button>
                                    <button type="button" class="popover-btn-done" id="doneStatusFilterBtn">Áp dụng</button>
                                </div>
                            </div>
                        </div>

                        <!-- Nút 2: Tựa game -->
                        <div class="pill-dropdown-wrapper" id="gamePillWrapper">
                            <button type="button" class="filter-pill-btn" id="gamePillBtn">
                                <span id="gamePillLabel">Tựa game</span>
                                <svg class="pill-caret" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M7 10l5 5 5-5z"/>
                                </svg>
                            </button>
                            <div class="pill-dropdown-menu pill-dropdown-scroll" id="gameDropdownMenu" style="display: none;">
                                <div class="dropdown-section-title">Chọn tựa game</div>
                                <button type="button" class="dropdown-item active" data-game="">Tất cả tựa game</button>
                                <button type="button" class="dropdown-item" data-game="Liên Minh Huyền Thoại">Liên Minh Huyền Thoại</button>
                                <button type="button" class="dropdown-item" data-game="Valorant">Valorant</button>
                                <button type="button" class="dropdown-item" data-game="Teamfight Tactics">Teamfight Tactics</button>
                                <button type="button" class="dropdown-item" data-game="CS2">CS2</button>
                                <button type="button" class="dropdown-item" data-game="Delta Force">Delta Force</button>
                                <button type="button" class="dropdown-item" data-game="The Isle">The Isle</button>
                                <button type="button" class="dropdown-item" data-game="PUBG">PUBG</button>
                                <button type="button" class="dropdown-item" data-game="Dota 2">Dota 2</button>
                                <button type="button" class="dropdown-item" data-game="FIFA Online">FIFA Online</button>
                                <button type="button" class="dropdown-item" data-game="Street Fighter 6">Street Fighter 6</button>
                                <button type="button" class="dropdown-item" data-game="Super Smash Bros. Ultimate">Super Smash Bros. Ultimate</button>
                                <button type="button" class="dropdown-item" data-game="Avatar Legends: The Fighting Game">Avatar Legends: The Fighting Game</button>
                                <button type="button" class="dropdown-item" data-game="2XKO">2XKO</button>
                            </div>
                        </div>

                        <!-- Nút 3: Ngày bắt đầu -->
                        <div class="pill-dropdown-wrapper" id="datePillWrapper">
                            <button type="button" class="filter-pill-btn" id="datePillBtn">
                                <span id="datePillLabel">Ngày bắt đầu</span>
                                <svg class="pill-caret" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M7 10l5 5 5-5z"/>
                                </svg>
                            </button>
                            <div class="pill-dropdown-menu filter-popover-card" id="dateDropdownMenu" style="display: none;">
                                <div class="popover-header">Ngày bắt đầu</div>
                                <div class="popover-body">
                                    <label class="popover-check-item">
                                        <input type="checkbox" name="dateRangeFilter" value="next_7_days">
                                        <span class="custom-checkbox"></span>
                                        <span class="check-label-text">7 ngày tới</span>
                                    </label>
                                    <label class="popover-check-item">
                                        <input type="checkbox" name="dateRangeFilter" value="next_month">
                                        <span class="custom-checkbox"></span>
                                        <span class="check-label-text">Tháng tới</span>
                                    </label>
                                    <label class="popover-check-item">
                                        <input type="checkbox" name="dateRangeFilter" value="next_3_months">
                                        <span class="custom-checkbox"></span>
                                        <span class="check-label-text">3 tháng tới</span>
                                    </label>
                                    <label class="popover-check-item">
                                        <input type="checkbox" name="dateRangeFilter" value="next_6_months">
                                        <span class="custom-checkbox"></span>
                                        <span class="check-label-text">6 tháng tới</span>
                                    </label>
                                    <label class="popover-check-item">
                                        <input type="checkbox" name="dateRangeFilter" value="past_7_days">
                                        <span class="custom-checkbox"></span>
                                        <span class="check-label-text">7 ngày qua</span>
                                    </label>
                                    <label class="popover-check-item">
                                        <input type="checkbox" name="dateRangeFilter" value="custom">
                                        <span class="custom-checkbox"></span>
                                        <span class="check-label-text">Tùy chọn ngày</span>
                                    </label>

                                    <div class="custom-dates-box" id="customDatesBox" style="display: none;">
                                        <div class="custom-date-field">
                                            <label for="customStartDateInput">Từ ngày</label>
                                            <input type="date" id="customStartDateInput" class="custom-date-input">
                                        </div>
                                        <div class="custom-date-field">
                                            <label for="customEndDateInput">Đến ngày</label>
                                            <input type="date" id="customEndDateInput" class="custom-date-input">
                                        </div>
                                    </div>
                                </div>
                                <div class="popover-footer">
                                    <button type="button" class="popover-btn-clear" id="clearDateFilterBtn">Xóa</button>
                                    <button type="button" class="popover-btn-done" id="doneDateFilterBtn">Áp dụng</button>
                                </div>
                            </div>
                        </div>

                        <!-- Nút Đặt lại bộ lọc -->
                        <button type="button" class="filter-reset-btn" id="resetFiltersBtn" style="display: none;">
                            Đặt lại bộ lọc
                        </button>
                    </div>

                    <!-- Danh sách thẻ giải đấu ngang -->
                    <div class="tournament-list" id="searchTournamentList">
                        <!-- Render bởi search.js -->
                    </div>

                    <!-- Trạng thái trống -->
                    <div class="search-empty-state" id="searchEmptyState" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <h3>Không tìm thấy giải đấu nào</h3>
                        <p>Thử thay đổi từ khóa tìm kiếm, địa điểm hoặc các tùy chọn bộ lọc.</p>
                    </div>

                    <!-- Phân trang (Pagination) -->
                    <nav class="search-pagination" id="searchPagination" aria-label="Phân trang giải đấu">
                        <!-- Render bởi search.js -->
                    </nav>
                </div>
            </section>
        </div>
    </th:block>

    <script type="module" th:src="@{/js/pages/home/search.js}"></script>
</body>
</html>
