<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layouts/base :: commonHead('BTP-OOP Application')}" />
    <link rel="stylesheet" th:href="@{/css/common/base.css}">
    <link rel="stylesheet" th:href="@{/css/pages/home/index.css}">
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-left">
            <a href="#" class="logo-link">
                <img th:src="@{/images/logo.png}" alt="Logo" class="logo">
            </a>
        </div>
        <div class="nav-right">
            <button class="nav-btn search-btn">Tìm kiếm</button>
            <a href="login.html" th:href="@{/login}" class="nav-btn login-btn" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">Đăng nhập</a>
        </div>
    </nav>

    <!-- Hero / Khu vực đầu trang -->
    <header class="hero">
        <img th:src="@{/images/hero.png}" alt="Hero Banner" class="hero-image">
    </header>

    <!-- Trò chơi của chúng tôi -->
    <section class="our-games">
        <div class="container">
            <h2 class="section-title">TRÒ CHƠI CỦA CHÚNG TÔI</h2>
            <div class="carousel-wrapper">
                <div class="carousel-container">
                    <div class="carousel-track">
                        <div class="carousel-item" data-index="0">
                            <div class="card-image-box">
                                <img th:src="@{/images/game1.png}" alt="League of Legends" class="game-image">
                                <div class="card-overlay">
                                    <!-- <h3 class="game-title">League of Legends</h3> -->
                                </div>
                            </div>
                        </div>
                        <div class="carousel-item active" data-index="1">
                            <div class="card-image-box">
                                <img th:src="@{/images/game2.png}" alt="Valorant" class="game-image">
                                <div class="card-overlay">
                                    <!-- <h3 class="game-title">Valorant</h3> -->
                                </div>
                            </div>
                        </div>
                        <div class="carousel-item" data-index="2">
                            <div class="card-image-box">
                                <img th:src="@{/images/game3.png}" alt="Teamfight Tactics" class="game-image">
                                <div class="card-overlay">
                                </div>
                            </div>
                        </div>
                        <div class="carousel-item" data-index="2">
                            <div class="card-image-box">
                                <img th:src="@{/images/game4.png}" alt="Counter Strike 2" class="game-image">
                                <div class="card-overlay">
                                </div>
                            </div>
                        </div>
                        <div class="carousel-item" data-index="2">
                            <div class="card-image-box">
                                <img th:src="@{/images/game5.png}" alt="Delta Force" class="game-image">
                                <div class="card-overlay">
                                </div>
                            </div>
                        </div>
                        <div class="carousel-item" data-index="2">
                            <div class="card-image-box">
                                <img th:src="@{/images/game6.png}" alt="The Isle" class="game-image">
                                <div class="card-overlay">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <img th:src="@{/images/logo.png}" alt="Logo" class="footer-logo">
            <a href="#" class="back-to-top" id="backToTop">TỚI ĐẦU TRANG</a>
        </div>
    </footer>

    <script type="module" th:src="@{/js/pages/home/index.js}"></script>
</body>
</html>
