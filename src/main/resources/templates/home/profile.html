<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app-layout :: layout('User Profile - BTP Tournament', 'profile', ~{::link}, ~{::pageContent}, ~{::script})}">
<head>
    <link rel="stylesheet" th:href="@{/css/pages/home/profile.css}">
    <link rel="stylesheet" th:href="@{/css/common/toast.css}">
</head>
<body>
    <th:block th:fragment="pageContent">
        <div class="pf-public-page">
            <!-- 1. BANNER HỌA TIẾT TAM GIÁC XÁM NHẠT -->
            <div class="pf-banner" id="publicProfileBanner"></div>

            <!-- 2. HEADER THÔNG TIN NGƯỜI DÙNG -->
            <header class="pf-header-bar">
                <div class="pf-header-container">
                    <div class="pf-header-left">
                        <div class="pf-big-avatar" id="publicProfileAvatarBox">
                            <img id="publicProfileAvatarImg" src="" alt="Avatar" class="pf-big-avatar-img" style="display: none;">
                            <span id="publicProfileAvatarInitial" class="pf-big-avatar-initial">T</span>
                        </div>

                        <div class="pf-identity">
                            <div class="pf-name-line">
                                <span id="publicProfilePrefix" class="pf-prefix-text" style="display: none;"></span>
                                <h1 class="pf-gamertag" id="publicProfileTagName">tungquan</h1>
                                <span class="pf-user-code" id="publicProfileUserCode">f4c0f609</span>
                                <span class="pf-pronouns-pill" id="publicProfilePronouns" style="display: none;"></span>
                            </div>

                            <p class="pf-bio-line" id="publicProfileBio" style="display: none;"></p>

                            <div class="pf-meta-line">
                                <span class="pf-meta-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                        <line x1="16" y1="2" x2="16" y2="6"/>
                                        <line x1="8" y1="2" x2="8" y2="6"/>
                                        <line x1="3" y1="10" x2="21" y2="10"/>
                                    </svg>
                                    <span id="publicProfileJoined">October 2026</span>
                                </span>

                                <span class="pf-meta-item" id="publicProfileLocationWrap">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                                        <circle cx="12" cy="10" r="3"/>
                                    </svg>
                                    <span id="publicProfileLocation">Vietnam</span>
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="pf-header-right">
                        <a th:href="@{/profile/settings(tab='profile')}" class="pf-more-btn" title="Profile Settings">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <circle cx="12" cy="5" r="2"/>
                                <circle cx="12" cy="12" r="2"/>
                                <circle cx="12" cy="19" r="2"/>
                            </svg>
                        </a>
                    </div>
                </div>
            </header>

            <!-- 3. NỘI DUNG CHÍNH (ĐÃ BỎ HỘP SOCIAL CONNECTIONS) -->
            <section class="pf-body-container">
                <!-- HỘP 1: UPCOMING EVENTS -->
                <div class="pf-content-card">
                    <div class="pf-card-top">
                        <h2 class="pf-card-heading">UPCOMING EVENTS</h2>
                        <a th:href="@{/dashboard}" class="pf-card-link">View all</a>
                    </div>
                    <div class="pf-upcoming-empty">
                        <p class="pf-upcoming-text">No upcoming events</p>
                        <a th:href="@{/dashboard}" class="pf-find-events-link">Find events</a>
                    </div>
                </div>

                <!-- HỘP 2: TOURNAMENTS ORGANIZED -->
                <div class="pf-content-card">
                    <div class="pf-card-top">
                        <h2 class="pf-card-heading">TOURNAMENTS ORGANIZED</h2>
                        <a th:href="@{/tournament/home}" class="pf-card-link">View all</a>
                    </div>
                    <div class="pf-organized-list" id="organizedTournamentsList">
                        <!-- Được render tự động từ JS -->
                    </div>
                </div>
            </section>
        </div>

        <div th:replace="~{fragments/toast :: toast}"></div>
    </th:block>

    <script type="module" th:src="@{/js/pages/home/profile.js}"></script>
</body>
</html>
